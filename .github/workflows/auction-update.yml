name: Update auction workbook

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'

permissions:
  contents: write

jobs:
  update-workbook:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run updater
        run: python update_auction_data.py

      - name: Upload debug files if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_rba_page.png
            debug_rba_page.html
          if-no-files-found: ignore

      - name: Upload updated workbook
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: updated-auction-workbook
          path: Copy of RBA Auction Data V2.xlsx

      - name: Commit updated workbook
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Copy of RBA Auction Data V2.xlsx"
          git diff --cached --quiet || git commit -m "Automated auction workbook update"
          git push
